<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perpetual Sunset — a café where the sun never finishes setting</title>
  <meta name="description" content="A Balearic café at eternal golden hour. Downtempo sets, warm light, nowhere to be." />
  <meta name="theme-color" content="#1a0e2e" />
  <meta property="og:title" content="Perpetual Sunset" />
  <meta property="og:description" content="A café on the edge of the Mediterranean where the sun never finishes setting." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%85%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // "just the sunset" is remembered: restore it before first paint so nothing flashes
    try { if (localStorage.getItem("ps_scenery") === "1") document.documentElement.classList.add("scenery"); } catch (e) {}
  </script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="hud hud-top">
    <div class="wordmark">
      <h1><img src="logo.svg" alt="Perpetual Sunset" /></h1>
      <p class="tagline">Balearic beats · est. forever</p>
    </div>
  </header>

  <footer class="hud hud-bottom">
    <a class="now-playing" id="now-playing" href="https://www.mixcloud.com/trotika/" target="_blank" rel="noopener" title="Open this set on Mixcloud">
      <span class="dot" aria-hidden="true"></span>
      <span id="np-text">Tonight's resident is warming up…</span>
    </a>
    <div id="player-dock"></div>
  </footer>

  <nav class="hour" id="hour" aria-label="Hour of the evening">
    <div class="hour-line" aria-hidden="true"><span class="hour-sun"></span></div>
    <div class="hour-words">
      <button type="button" aria-pressed="false" aria-label="Afternoon, 8 PM"><span class="name">Afternoon</span><span class="time">8<small>pm</small></span></button>
      <button type="button" aria-pressed="false" aria-label="Golden hour, 9 PM"><span class="name">Golden hour</span><span class="time">9<small>pm</small></span></button>
      <button type="button" aria-pressed="false" aria-label="Sunset, 9:30 PM"><span class="name">Sunset</span><span class="time">9:30<small>pm</small></span></button>
      <button type="button" aria-pressed="false" aria-label="Dusk, 10 PM"><span class="name">Dusk</span><span class="time">10<small>pm</small></span></button>
      <button type="button" aria-pressed="false" aria-label="Blue hour, 10:30 PM"><span class="name">Blue hour</span><span class="time">10:30<small>pm</small></span></button>
    </div>
  </nav>

  <div class="gate" id="gate">
    <div class="gate-inner">
      <h1><img src="logo.svg" alt="Perpetual Sunset" /></h1>
      <p>A café on the edge of the Mediterranean where the sun never finishes setting.</p>
      <button id="enter" onclick="window.__wantsAudio = true">Take a seat</button>
      <p class="fine">sound on · the set is live</p>
    </div>
  </div>

  <button id="scenery" class="scenery-toggle" aria-pressed="false" aria-label="Just the sunset" title="Just the sunset">
    <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" />
      <circle cx="12" cy="12" r="2.6" />
    </svg>
    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4.2 8.3C3.1 9.6 2.5 12 2.5 12s3.5 6 9.5 6c1.1 0 2.1-.2 3-.5" />
      <path d="M9.2 6.4c.9-.3 1.8-.4 2.8-.4 6 0 9.5 6 9.5 6s-.9 1.6-2.6 3.1" />
      <path d="M10.2 10.2a2.6 2.6 0 0 0 3.6 3.6" />
      <line x1="4" y1="4" x2="20" y2="20" />
    </svg>
  </button>

  <button id="sound-pill" class="sound-pill" hidden aria-label="Sound on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11.5 5.5 7 9H4v6h3l4.5 3.5v-13z" />
      <line x1="15.5" y1="10" x2="19.5" y2="14" />
      <line x1="19.5" y1="10" x2="15.5" y2="14" />
    </svg>
    <span class="pill-label">sound on</span>
  </button>

  <script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
